    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 아이콘 컴포넌트들 (단일 파일 실행을 위해 SVG로 직접 구현) ---
        const IconBase = ({ children, className = "w-6 h-6", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );
        const Dumbbell = (props) => <IconBase {...props}><path d="m14.4 14.4 5.6 5.6"/><path d="M22 17v-4l-2-2-4 4-2-2 4-4-2-2"/><path d="M11.6 11.6 14.4 14.4"/><path d="m2 17 5.6-5.6"/><path d="M7 2v4l2 2 4-4 2 2-4 4 2 2"/></IconBase>;
        const Plus = (props) => <IconBase {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;

        const CalendarIcon = (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconBase>;

        const Quote = (props) => <IconBase {...props}><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></IconBase>;
        const Sparkles = (props) => <IconBase {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></IconBase>;
        const Medal = (props) => <IconBase {...props}><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.73"/><path d="m13 12 5.88-9.27"/><path d="M15 19a3 3 0 1 1-6 0c0-1.66 3-8 3-8s3 6.34 3 8z"/></IconBase>;
        const ChevronLeft = (props) => <IconBase {...props}><path d="m15 18-6-6 6-6"/></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><path d="m9 18 6-6-6-6"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Timer = (props) => <IconBase {...props}><line x1="10" y1="2" x2="14" y2="2"/><line x1="12" y1="14" x2="15" y2="11"/><circle cx="12" cy="14" r="8"/></IconBase>;
        const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3"/></IconBase>;
        const Pause = (props) => <IconBase {...props}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></IconBase>;
        const RotateCcw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>;
        const RefreshCw = (props) => <IconBase {...props}><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></IconBase>;
        const Globe = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></IconBase>;

        // --- 앱 메인 코드 ---
        const DAYS_OF_WEEK = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];

        const DAILY_QUOTES = [
          { ko: "건강한 몸에 건강한 정신이 깃듭니다! 오늘도 화이팅!", en: "A sound mind in a sound body! Go for it today!" },
          { ko: "오늘 흘린 땀방울이 내일의 강한 나를 만듭니다.", en: "The sweat you shed today makes a stronger you tomorrow." },
          { ko: "작은 실천이 모여 큰 변화를 이룹니다. 시작이 반이에요!", en: "Small actions create big changes. Well begun is half done!" },
          { ko: "포기하고 싶은 그 순간이 진짜 운동의 시작입니다.", en: "The moment you want to quit is when the real workout begins." },
          { ko: "오늘도 자신과의 약속을 지켜낸 당신, 정말 멋집니다!", en: "You kept your promise to yourself today. You are awesome!" },
          { ko: "천천히 가도 괜찮아요. 멈추지만 않으면 됩니다.", en: "It does not matter how slowly you go as long as you do not stop." },
          { ko: "운동은 내 몸에게 주는 가장 좋은 선물입니다.", en: "Exercise is the best gift you can give to your body." },
          { ko: "어제보다 1개 더! 조금씩 성장하는 나를 발견해보세요.", en: "One more than yesterday! Discover yourself growing little by little." },
          { ko: "노력은 결코 배신하지 않습니다.", en: "Hard work never betrays you." },
          { ko: "할 수 있다고 믿으면 이미 절반은 이룬 것입니다.", en: "Believe you can and you're halfway there." }
        ];

        const TRANSLATIONS = {
          ko: {
            title: '나의 운동 플래너',
            plannerTab: '주간 플래너',
            calendarTab: '월간 플래너',
            lateWarning: '오후 9시가 지났어요! 아직 완료하지 않은 운동이 있습니다.',
            welcome: '환영합니다!',
            onboardingDesc: '시작하기 전에, 평소에 하고 싶은 운동이나 알고 있는 운동을 쉼표(,)로 구분해서 적어주세요. 저희가 일주일 루틴을 짜드릴게요!',
            placeholder: '예: 푸시업, 스쿼트, 달리기',
            generateBtn: '내 운동 루틴 만들기',
            skip: '건너뛰기 (직접 짤래요)',
            emptyAlert: '운동을 하나 이상 입력해주세요!',
            stretching: '가벼운 전신 스트레칭 (휴식)',
            routine: '루틴',
            completedOf: (completed, total) => `총 ${total}개의 운동 중 ${completed}개 완료`,
            noWorkout: '예정된 운동이 없습니다.',
            noWorkoutDesc: '새로운 운동을 추가하여 루틴을 만들어보세요!',
            addWorkout: '운동 추가하기',
            newWorkout: '새 운동 추가',
            exName: '운동 이름',
            exNamePlaceholder: '예: 벤치 프레스',
            weight: '무게(kg)',
            sets: '세트',
            reps: '횟수',
            cancel: '취소',
            save: '저장하기',
            yearMonth: (y, m) => `${y}년 ${m}월`,
            shortDays: ['일', '월', '화', '수', '목', '금', '토'],
            attended: '앱 출석',
            completed: '운동 완료',
            record: '기록',
            noRecord: '이날은 등록된 운동이 없었습니다.',
            days: { '월요일': '월요일', '화요일': '화요일', '수요일': '수요일', '목요일': '목요일', '금요일': '금요일', '토요일': '토요일', '일요일': '일요일' },
            displayDay: (day) => day.replace('요일', '')
          },
          en: {
            title: 'Workout Planner',
            plannerTab: 'Weekly Planner',
            calendarTab: 'Monthly Planner',
            lateWarning: "It's past 9 PM! You still have unfinished workouts.",
            welcome: 'Welcome!',
            onboardingDesc: 'Before we start, enter the exercises you want to do separated by commas (,). We will create a weekly routine for you!',
            placeholder: 'e.g., Push-up, Squat, Running',
            generateBtn: 'Create My Routine',
            skip: 'Skip (I will do it myself)',
            emptyAlert: 'Please enter at least one exercise!',
            stretching: 'Light Full-Body Stretching (Rest)',
            routine: 'Routine',
            completedOf: (completed, total) => `${completed} out of ${total} completed`,
            noWorkout: 'No workouts scheduled.',
            noWorkoutDesc: 'Add a new exercise to create your routine!',
            addWorkout: 'Add Workout',
            newWorkout: 'New Workout',
            exName: 'Exercise Name',
            exNamePlaceholder: 'e.g., Bench Press',
            weight: 'Weight(kg)',
            sets: 'Sets',
            reps: 'Reps/Time',
            cancel: 'Cancel',
            save: 'Save',
            yearMonth: (y, m) => `${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m - 1]} ${y}`,
            shortDays: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
            attended: 'App Attended',
            completed: 'Workout Done',
            record: 'Records',
            noRecord: 'No exercises recorded for this day.',
            days: { '월요일': 'Monday', '화요일': 'Tuesday', '수요일': 'Wednesday', '목요일': 'Thursday', '금요일': 'Friday', '토요일': 'Saturday', '일요일': 'Sunday' },
            displayDay: (day) => ({ '월요일': 'Mon', '화요일': 'Tue', '수요일': 'Wed', '목요일': 'Thu', '금요일': 'Fri', '토요일': 'Sat', '일요일': 'Sun' }[day])
          }
        };

        function useLocalStorage(key, initialValue) {
          const [storedValue, setStoredValue] = useState(() => {
            try {
              const item = window.localStorage.getItem(key);
              return item ? JSON.parse(item) : initialValue;
            } catch (error) {
              console.log(error);
              return initialValue;
            }
          });

          const setValue = (value) => {
            try {
              const valueToStore = value instanceof Function ? value(storedValue) : value;
              setStoredValue(valueToStore);
              window.localStorage.setItem(key, JSON.stringify(valueToStore));
            } catch (error) {
              console.log(error);
            }
          };
          return [storedValue, setValue];
        }

        function App() {
          const [lang, setLang] = useLocalStorage('language', 'ko');
          const t = TRANSLATIONS[lang];

          const [isFirstTime, setIsFirstTime] = useLocalStorage('isFirstTime', true);
          const [workouts, setWorkouts] = useLocalStorage('workouts', {
            '월요일': [], '화요일': [], '수요일': [], '목요일': [], '금요일': [], '토요일': [], '일요일': []
          });
          const [history, setHistory] = useLocalStorage('workoutHistory', {}); 
          
          const [activeTab, setActiveTab] = useState('planner');
          const [selectedDay, setSelectedDay] = useState('');
          const [isAdding, setIsAdding] = useState(false);
          const [isLateWarning, setIsLateWarning] = useState(false);
          const [dailyQuote, setDailyQuote] = useState({ ko: '', en: '' });

          const [time, setTime] = useState(0);
          const [isTimerRunning, setIsTimerRunning] = useState(false);
          const [showTimer, setShowTimer] = useState(false);

          const formatUnit = (val, unitKo) => {
            const unitEnMap = { '분': 'min', '초': 'sec', '회': 'reps', '세트': 'sets' };
            if (lang === 'ko') return `${val}${unitKo}`;
            return `${val} ${unitEnMap[unitKo] || unitKo}`;
          };

          useEffect(() => {
            let interval;
            if (isTimerRunning) {
              interval = setInterval(() => setTime((prev) => prev + 1), 1000);
            } else {
              clearInterval(interval);
            }
            return () => clearInterval(interval);
          }, [isTimerRunning]);

          const formatTime = (totalSeconds) => {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
          };

          const getTodayDateString = () => {
            const today = new Date();
            return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
          };

          const getTodayDayName = () => {
            const today = new Date();
            const dayIndex = today.getDay(); 
            return dayIndex === 0 ? '일요일' : DAYS_OF_WEEK[dayIndex - 1];
          };

          const changeQuote = () => {
            const randomIndex = Math.floor(Math.random() * DAILY_QUOTES.length);
            setDailyQuote(DAILY_QUOTES[randomIndex]);
          };

          useEffect(() => {
            const todayStr = getTodayDateString();
            const todayName = getTodayDayName();
            setSelectedDay(todayName);
            changeQuote();

            if (!isFirstTime) {
              setHistory(prev => {
                const todayHistory = prev[todayStr];
                if (!todayHistory) return { ...prev, [todayStr]: { status: 'attended', exercises: [] } };
                return prev;
              });
            }
          }, [isFirstTime]);

          useEffect(() => {
            const checkTime = () => {
              const now = new Date();
              if (now.getHours() >= 21) {
                const todayName = getTodayDayName();
                const todaysWorkouts = workouts[todayName] || [];
                const isAllCompleted = todaysWorkouts.length > 0 && todaysWorkouts.every(w => w.completed);
                const hasWorkouts = todaysWorkouts.length > 0;
                
                setIsLateWarning(hasWorkouts && !isAllCompleted);
              } else {
                setIsLateWarning(false);
              }
            };

            checkTime();
            const interval = setInterval(checkTime, 60000);
            return () => clearInterval(interval);
          }, [workouts]);

          const updateHistory = (updatedWorkouts, targetDayName) => {
            const todayName = getTodayDayName();
            if (targetDayName === todayName) {
              const todaysWorkouts = updatedWorkouts[todayName] || [];
              const hasWorkouts = todaysWorkouts.length > 0;
              const isAllCompleted = hasWorkouts && todaysWorkouts.every(w => w.completed);
              
              setHistory(prev => ({
                ...prev,
                [getTodayDateString()]: {
                  status: isAllCompleted ? 'completed' : 'attended',
                  exercises: todaysWorkouts
                }
              }));
            }
          };

          const handleToggleComplete = (day, exerciseId) => {
            const newWorkouts = {
              ...workouts,
              [day]: workouts[day].map(ex => 
                ex.id === exerciseId ? { ...ex, completed: !ex.completed } : ex
              )
            };
            setWorkouts(newWorkouts);
            updateHistory(newWorkouts, day);
          };

          const handleDeleteExercise = (day, exerciseId) => {
            const newWorkouts = {
              ...workouts,
              [day]: workouts[day].filter(ex => ex.id !== exerciseId)
            };
            setWorkouts(newWorkouts);
            updateHistory(newWorkouts, day);
          };

          const [newExercise, setNewExercise] = useState({ name: '', sets: 3, reps: 10, weight: 0 });

          const handleAddExercise = (e) => {
            e.preventDefault();
            if (!newExercise.name.trim()) return;

            const exerciseToAdd = {
              id: Date.now(),
              name: newExercise.name,
              sets: Number(newExercise.sets),
              reps: Number(newExercise.reps),
              weight: Number(newExercise.weight),
              unit: '회',
              completed: false
            };

            const newWorkouts = {
              ...workouts,
              [selectedDay]: [...workouts[selectedDay], exerciseToAdd]
            };

            setWorkouts(newWorkouts);
            updateHistory(newWorkouts, selectedDay);
            setNewExercise({ name: '', sets: 3, reps: 10, weight: 0 });
            setIsAdding(false);
          };

          const Onboarding = () => {
            const [inputList, setInputList] = useState('');

            const getExerciseBalance = (name) => {
              const lowerName = name.replace(/\s+/g, '').toLowerCase();
              if (lowerName.includes('달리기') || lowerName.includes('걷기') || lowerName.includes('유산소') || lowerName.includes('run') || lowerName.includes('jog') || lowerName.includes('walk') || lowerName.includes('cardio')) {
                return { sets: 1, reps: 20, weight: 0, unit: '분' };
              }
              if (lowerName.includes('플랭크') || lowerName.includes('plank')) {
                return { sets: 3, reps: 30, weight: 0, unit: '초' };
              }
              if (lowerName.includes('턱걸이') || lowerName.includes('풀업') || lowerName.includes('pull') || lowerName.includes('chin')) {
                return { sets: 3, reps: 5, weight: 0, unit: '회' }; 
              }
              if (lowerName.includes('스쿼트') || lowerName.includes('런지') || lowerName.includes('squat') || lowerName.includes('lunge')) {
                return { sets: 3, reps: 15, weight: 0, unit: '회' };
              }
              if (lowerName.includes('윗몸') || lowerName.includes('크런치') || lowerName.includes('레그레이즈') || lowerName.includes('복근') || lowerName.includes('crunch') || lowerName.includes('abs') || lowerName.includes('sit')) {
                return { sets: 3, reps: 20, weight: 0, unit: '회' };
              }
              return { sets: 3, reps: 12, weight: 0, unit: '회' };
            };

            const handleGenerateRoutine = () => {
              const exerciseNames = inputList.split(',').map(name => name.trim()).filter(name => name !== '');
              
              if (exerciseNames.length === 0) {
                alert(t.emptyAlert);
                return;
              }

              const generatedWorkouts = { '월요일': [], '화요일': [], '수요일': [], '목요일': [], '금요일': [], '토요일': [], '일요일': [] };

              let exerciseIndex = 0;
              for (let i = 0; i < 6; i++) { 
                const day = DAYS_OF_WEEK[i];
                for (let j = 0; j < 2; j++) {
                  const exName = exerciseNames[exerciseIndex % exerciseNames.length];
                  const balance = getExerciseBalance(exName);
                  generatedWorkouts[day].push({
                    id: Date.now() + Math.random(),
                    name: exName,
                    sets: balance.sets,
                    reps: balance.reps,
                    weight: balance.weight,
                    unit: balance.unit,
                    completed: false
                  });
                  exerciseIndex++;
                }
              }

              generatedWorkouts['일요일'].push({
                id: Date.now() + Math.random(),
                name: t.stretching,
                sets: 1,
                reps: 15,
                weight: 0,
                unit: '분',
                completed: false
              });

              setWorkouts(generatedWorkouts);
              setIsFirstTime(false);
            };

            return (
              <div className="min-h-screen bg-indigo-600 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl text-center">
                  <Sparkles className="w-16 h-16 text-yellow-400 mx-auto mb-4" />
                  <h2 className="text-2xl font-bold text-gray-800 mb-2">{t.welcome}</h2>
                  <p className="text-gray-600 mb-6">{t.onboardingDesc}</p>
                  
                  <textarea
                    className="w-full p-4 border-2 border-indigo-100 rounded-xl mb-6 focus:border-indigo-500 focus:outline-none resize-none"
                    rows="4"
                    placeholder={t.placeholder}
                    value={inputList}
                    onChange={(e) => setInputList(e.target.value)}
                  ></textarea>

                  <button 
                    onClick={handleGenerateRoutine}
                    className="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200"
                  >
                    {t.generateBtn}
                  </button>
                  
                  <button 
                    onClick={() => setIsFirstTime(false)}
                    className="w-full mt-4 py-2 text-gray-400 hover:text-gray-600 font-medium transition-colors"
                  >
                    {t.skip}
                  </button>
                </div>
              </div>
            );
          };

          const CalendarView = () => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedHistoryDate, setSelectedHistoryDate] = useState(null);

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayOfMonth = new Date(year, month, 1).getDay(); 

            const prevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
            const nextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

            const days = [];
            for (let i = 0; i < firstDayOfMonth; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) days.push(i);

            const openHistoryModal = (day) => {
              const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
              if (history[dateStr]) setSelectedHistoryDate(dateStr);
            };

            return (
              <div className="pb-24 animate-in fade-in duration-300">
                <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                  
                  <div className="flex justify-between items-center mb-6">
                    <button onClick={prevMonth} className="p-2 bg-gray-50 rounded-full hover:bg-gray-100"><ChevronLeft className="w-5 h-5 text-gray-600" /></button>
                    <h2 className="text-xl font-bold text-gray-800">{t.yearMonth(year, month + 1)}</h2>
                    <button onClick={nextMonth} className="p-2 bg-gray-50 rounded-full hover:bg-gray-100"><ChevronRight className="w-5 h-5 text-gray-600" /></button>
                  </div>

                  <div className="grid grid-cols-7 gap-1 text-center mb-2">
                    {t.shortDays.map((d, i) => (
                      <div key={d} className={`text-xs font-bold ${i === 0 ? 'text-red-400' : i === 6 ? 'text-blue-400' : 'text-gray-400'}`}>
                        {d}
                      </div>
                    ))}
                  </div>

                  <div className="grid grid-cols-7 gap-2">
                    {days.map((day, idx) => {
                      if (!day) return <div key={`empty-${idx}`} className="h-12"></div>;
                      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                      const dayData = history[dateStr];
                      const isToday = dateStr === getTodayDateString();

                      return (
                        <div 
                          key={idx} 
                          onClick={() => dayData && openHistoryModal(day)}
                          className={`relative h-12 flex items-center justify-center rounded-xl cursor-pointer transition-all ${
                            isToday ? 'bg-indigo-50 font-bold text-indigo-700' : 'text-gray-700 hover:bg-gray-50'
                          } ${dayData ? 'border border-gray-100' : ''}`}
                        >
                          <span className="z-10">{day}</span>
                          {dayData?.status === 'completed' && <Medal className="absolute w-8 h-8 text-green-400/30 rotate-12 scale-125" />}
                          {dayData?.status === 'completed' && <div className="absolute bottom-1 right-1 w-2 h-2 bg-green-500 rounded-full"></div>}
                          {dayData?.status === 'attended' && <div className="absolute bottom-1 right-1 w-2 h-2 bg-orange-400 rounded-full"></div>}
                        </div>
                      );
                    })}
                  </div>

                  <div className="mt-6 flex gap-4 justify-center text-xs text-gray-500">
                    <div className="flex items-center gap-1"><div className="w-2 h-2 bg-green-500 rounded-full"></div> {t.completed}</div>
                    <div className="flex items-center gap-1"><div className="w-2 h-2 bg-orange-400 rounded-full"></div> {t.attended}</div>
                  </div>
                </div>

                {selectedHistoryDate && (
                  <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 animate-in fade-in">
                    <div className="bg-white rounded-3xl p-6 w-full max-w-sm max-h-[80vh] overflow-y-auto">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold text-gray-800">{selectedHistoryDate} {t.record}</h3>
                        <button onClick={() => setSelectedHistoryDate(null)} className="p-1 text-gray-400 hover:text-gray-800">
                          <X className="w-6 h-6" />
                        </button>
                      </div>
                      
                      {history[selectedHistoryDate].exercises.length > 0 ? (
                        <div className="space-y-3">
                          {history[selectedHistoryDate].exercises.map(ex => (
                            <div key={ex.id} className="p-3 bg-gray-50 rounded-xl flex justify-between items-center border border-gray-100">
                              <div>
                                <p className={`font-bold ${ex.completed ? 'text-gray-800' : 'text-gray-400'}`}>{ex.name}</p>
                                <p className="text-xs text-gray-500 mt-1">
                                  {ex.weight > 0 ? `${ex.weight}kg · ` : ''}{formatUnit(ex.sets, '세트')} · {formatUnit(ex.reps, ex.unit || '회')}
                                </p>
                              </div>
                              {ex.completed ? <CheckCircle2 className="w-5 h-5 text-green-500" /> : <Circle className="w-5 h-5 text-gray-300" />}
                            </div>
                          ))}
                        </div>
                      ) : (
                        <p className="text-center text-gray-500 py-6">{t.noRecord}</p>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          };

          const PlannerView = () => {
            const todayWorkouts = workouts[selectedDay] || [];
            const completedCount = todayWorkouts.filter(w => w.completed).length;
            const progressPercentage = todayWorkouts.length > 0 
              ? Math.round((completedCount / todayWorkouts.length) * 100) 
              : 0;

            return (
              <div className="pb-24 animate-in fade-in duration-300">
                <div className="flex overflow-x-auto py-2 mb-6 gap-2 snap-x hide-scrollbar">
                  {DAYS_OF_WEEK.map((day) => (
                    <button
                      key={day}
                      onClick={() => setSelectedDay(day)}
                      className={`snap-center flex-shrink-0 px-5 py-3 rounded-2xl font-semibold text-sm transition-all duration-200 ${
                        selectedDay === day 
                          ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200 scale-105' 
                          : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-100'
                      }`}
                    >
                      {t.displayDay(day)}
                      {workouts[day].length > 0 && (
                        <div className={`mt-1 h-1 w-full rounded-full ${selectedDay === day ? 'bg-indigo-300' : 'bg-gray-200'}`} />
                      )}
                    </button>
                  ))}
                </div>

                <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 mb-6 relative overflow-hidden">
                  {progressPercentage === 100 && (
                    <div className="absolute top-0 right-0 p-4 opacity-10">
                      <Medal className="w-24 h-24 text-green-500" />
                    </div>
                  )}
                  <div className="flex justify-between items-end mb-3 relative z-10">
                    <div>
                      <h2 className="text-xl font-bold flex items-center gap-2">
                        <CalendarIcon className="w-5 h-5 text-indigo-500" />
                        {t.days[selectedDay]} {t.routine}
                      </h2>
                      <p className="text-gray-500 text-sm mt-1">
                        {t.completedOf(completedCount, todayWorkouts.length)}
                      </p>
                    </div>
                    <div className="text-right">
                      <span className="text-2xl font-black text-indigo-600">{progressPercentage}%</span>
                    </div>
                  </div>
                  <div className="w-full bg-gray-100 rounded-full h-2.5 relative z-10">
                    <div 
                      className={`h-2.5 rounded-full transition-all duration-500 ease-out ${progressPercentage === 100 ? 'bg-green-500' : 'bg-indigo-600'}`}
                      style={{ width: `${progressPercentage}%` }}
                    ></div>
                  </div>
                </div>

                <div className="space-y-3 mb-6">
                  {todayWorkouts.length === 0 ? (
                    <div className="text-center py-12 bg-white rounded-3xl border border-gray-100 border-dashed">
                      <Dumbbell className="w-12 h-12 text-gray-300 mx-auto mb-3" />
                      <p className="text-gray-500 font-bold">{t.noWorkout}</p>
                      <p className="text-gray-400 text-sm mt-1">{t.noWorkoutDesc}</p>
                    </div>
                  ) : (
                    todayWorkouts.map((exercise) => (
                      <div 
                        key={exercise.id} 
                        className={`group flex items-center justify-between p-4 bg-white rounded-2xl border transition-all duration-200 ${
                          exercise.completed ? 'border-green-200 bg-green-50/50' : 'border-gray-100 shadow-sm'
                        }`}
                      >
                        <div className="flex items-center gap-4 flex-1" onClick={() => handleToggleComplete(selectedDay, exercise.id)}>
                          <button className="focus:outline-none transition-transform active:scale-90">
                            {exercise.completed ? (
                              <CheckCircle2 className="w-7 h-7 text-green-500" />
                            ) : (
                              <Circle className="w-7 h-7 text-gray-300 hover:text-indigo-400" />
                            )}
                          </button>
                          <div className={`flex-1 cursor-pointer ${exercise.completed ? 'opacity-50' : ''}`}>
                            <h3 className={`font-bold text-lg ${exercise.completed ? 'line-through text-gray-500' : 'text-gray-800'}`}>
                              {exercise.name}
                            </h3>
                            <div className="flex gap-3 text-sm text-gray-500 mt-0.5">
                              {exercise.weight > 0 && <span className="bg-gray-100 px-2 py-0.5 rounded-md">{exercise.weight}kg</span>}
                              <span className="bg-gray-100 px-2 py-0.5 rounded-md">{formatUnit(exercise.sets, '세트')}</span>
                              <span className="bg-gray-100 px-2 py-0.5 rounded-md">{formatUnit(exercise.reps, exercise.unit || '회')}</span>
                            </div>
                          </div>
                        </div>
                        <button 
                          onClick={() => handleDeleteExercise(selectedDay, exercise.id)}
                          className="p-2 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors"
                        >
                          <Trash2 className="w-5 h-5" />
                        </button>
                      </div>
                    ))
                  )}
                </div>

                {!isAdding ? (
                  <button 
                    onClick={() => setIsAdding(true)}
                    className="w-full py-4 flex items-center justify-center gap-2 bg-indigo-50 text-indigo-600 font-bold rounded-2xl border-2 border-indigo-100 hover:bg-indigo-100 transition-colors"
                  >
                    <Plus className="w-5 h-5" />
                    {t.addWorkout}
                  </button>
                ) : (
                  <form onSubmit={handleAddExercise} className="bg-white p-5 rounded-3xl border border-gray-200 shadow-lg animate-in slide-in-from-bottom-4 fade-in">
                    <h3 className="font-bold text-lg mb-4 text-gray-800 flex items-center gap-2">
                      <Plus className="w-5 h-5 text-indigo-500" />
                      {t.newWorkout}
                    </h3>
                    <div className="space-y-4">
                      <div>
                        <label className="block text-sm font-semibold text-gray-600 mb-1">{t.exName}</label>
                        <input 
                          type="text" autoFocus required placeholder={t.exNamePlaceholder}
                          value={newExercise.name} onChange={(e) => setNewExercise({...newExercise, name: e.target.value})}
                          className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>
                      <div className="grid grid-cols-3 gap-3">
                        <div>
                          <label className="block text-sm font-semibold text-gray-600 mb-1">{t.weight}</label>
                          <input type="number" min="0" value={newExercise.weight} onChange={(e) => setNewExercise({...newExercise, weight: e.target.value})} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-center" />
                        </div>
                        <div>
                          <label className="block text-sm font-semibold text-gray-600 mb-1">{t.sets}</label>
                          <input type="number" min="1" required value={newExercise.sets} onChange={(e) => setNewExercise({...newExercise, sets: e.target.value})} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-center" />
                        </div>
                        <div>
                          <label className="block text-sm font-semibold text-gray-600 mb-1">{t.reps}</label>
                          <input type="number" min="1" required value={newExercise.reps} onChange={(e) => setNewExercise({...newExercise, reps: e.target.value})} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-center" />
                        </div>
                      </div>
                    </div>
                    <div className="flex gap-3 mt-6">
                      <button type="button" onClick={() => setIsAdding(false)} className="flex-1 py-3 px-4 bg-gray-100 text-gray-600 font-bold rounded-xl hover:bg-gray-200">{t.cancel}</button>
                      <button type="submit" className="flex-1 py-3 px-4 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700">{t.save}</button>
                    </div>
                  </form>
                )}
              </div>
            );
          };

          if (isFirstTime) return <Onboarding />;

          return (
            <div className="min-h-screen relative pb-20">
              {isLateWarning && (
                <div className="bg-red-500 text-white px-4 py-3 flex items-center justify-center gap-2 shadow-md">
                  <AlertCircle className="w-5 h-5" />
                  <span className="font-bold text-sm">{t.lateWarning}</span>
                </div>
              )}

              <header className="bg-indigo-600 text-white shadow-md relative overflow-hidden z-20">
                <div className="max-w-md mx-auto px-4 py-5 sm:max-w-3xl relative z-10">
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-3">
                      <div className="p-2 bg-white/20 rounded-xl backdrop-blur-sm">
                        <Dumbbell className="w-6 h-6" />
                      </div>
                      <h1 className="text-xl sm:text-2xl font-bold tracking-tight">{t.title}</h1>
                    </div>
                    
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={() => setLang(lang === 'ko' ? 'en' : 'ko')}
                        className="p-2 rounded-xl bg-white/20 hover:bg-white/30 text-indigo-50 backdrop-blur-sm transition-colors flex items-center gap-1.5"
                      >
                        <Globe className="w-5 h-5" />
                        <span className="text-xs font-bold">{lang === 'ko' ? 'EN' : 'KR'}</span>
                      </button>

                      <button 
                        onClick={() => setShowTimer(!showTimer)}
                        className={`p-2 rounded-xl backdrop-blur-sm transition-colors ${showTimer ? 'bg-indigo-400 text-white shadow-inner' : 'bg-white/20 hover:bg-white/30 text-indigo-50'}`}
                      >
                        <Timer className="w-5 h-5" />
                      </button>
                    </div>
                  </div>
                  
                  <div className="bg-white/10 rounded-2xl p-4 backdrop-blur-sm border border-white/20 flex gap-3 items-start relative">
                    <Quote className="w-5 h-5 text-indigo-200 flex-shrink-0 mt-0.5" />
                    <div className="flex-1 pr-6">
                      <p className="text-sm font-medium leading-relaxed text-indigo-50">
                        {lang === 'ko' ? dailyQuote.ko : dailyQuote.en}
                      </p>
                      <p className="text-xs text-indigo-200 mt-1 italic font-light">
                        "{lang === 'ko' ? dailyQuote.en : dailyQuote.ko}"
                      </p>
                    </div>
                    <button 
                      onClick={changeQuote} 
                      className="absolute top-4 right-4 text-white/50 hover:text-white transition-transform p-1 rounded-full"
                    >
                      <RefreshCw className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {showTimer && (
                  <div className="bg-indigo-700/80 backdrop-blur-md border-t border-indigo-500/30 py-4 flex justify-between items-center shadow-inner relative z-0">
                    <div className="max-w-md mx-auto sm:max-w-3xl w-full flex justify-between items-center px-6">
                      <div className="flex items-center gap-3">
                        <Timer className="w-6 h-6 text-indigo-200" />
                        <span className="text-4xl font-mono font-bold tracking-wider">{formatTime(time)}</span>
                      </div>
                      <div className="flex gap-3">
                        <button 
                          onClick={() => setIsTimerRunning(!isTimerRunning)} 
                          className={`p-3 rounded-full transition shadow-md flex items-center justify-center ${isTimerRunning ? 'bg-indigo-400 text-white' : 'bg-white text-indigo-600'}`}
                        >
                          {isTimerRunning ? <Pause className="w-6 h-6" /> : <Play className="w-6 h-6" />}
                        </button>
                        <button 
                          onClick={() => { setIsTimerRunning(false); setTime(0); }} 
                          className="p-3 bg-indigo-500 text-white rounded-full transition shadow-md flex items-center justify-center"
                        >
                          <RotateCcw className="w-6 h-6" />
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </header>

              <main className="max-w-md mx-auto sm:max-w-3xl p-4">
                {activeTab === 'planner' ? <PlannerView /> : <CalendarView />}
              </main>

              <nav className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 pb-safe z-50">
                <div className="max-w-md mx-auto flex justify-around">
                  <button 
                    onClick={() => setActiveTab('planner')}
                    className={`flex-1 py-4 flex flex-col items-center gap-1 transition-colors ${activeTab === 'planner' ? 'text-indigo-600' : 'text-gray-400'}`}
                  >
                    <Home className="w-6 h-6" />
                    <span className="text-xs font-bold">{t.plannerTab}</span>
                  </button>
                  <button 
                    onClick={() => setActiveTab('calendar')}
                    className={`flex-1 py-4 flex flex-col items-center gap-1 transition-colors ${activeTab === 'calendar' ? 'text-indigo-600' : 'text-gray-400'}`}
                  >
                    <CalendarIcon className="w-6 h-6" />
                    <span className="text-xs font-bold">{t.calendarTab}</span>
                  </button>
                </div>
              </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
